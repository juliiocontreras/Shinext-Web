<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#062d70">
  <title>Acceso Colaboradores | Shinext CRM</title>
  <link rel="icon" href="/brand/shinext-logo-original.webp">
  <link rel="stylesheet" href="/crm/crm.css">
</head>
<body class="crm-login-body" data-crm-page="login">
  <main class="crm-login-shell">
    <a href="/" class="crm-login-brand"><img src="/brand/shinext-logo-original.webp" alt="Shinext"></a>
    <section class="crm-login-card">
      <p class="crm-kicker">Colaboradores Shinext</p>
      <h1>Shinext CRM</h1>
      <p>Acceso interno para Dirección, Reclutamiento, Operaciones, Contabilidad, Compras y Ventas.</p>
      <form id="crm-login-form">
        <label>Correo electrónico<input name="email" type="email" autocomplete="email" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <div id="crm-login-status" class="crm-status" aria-live="polite"></div>
        <button id="crm-login-button" class="crm-primary-button" type="submit">Entrar al CRM</button>
      </form>
    </section>
  </main>
  <script type="module" src="/crm/crm.js"></script>
</body>
</html>
