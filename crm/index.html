<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#062d70">
  <title>Shinext CRM</title>
  <link rel="icon" href="/brand/shinext-logo-original.webp">
  <link rel="stylesheet" href="/crm/crm.css">
</head>
<body class="crm-body" data-crm-page="app">
  <div id="crm-loading" class="crm-loading">Cargando Shinext CRM…</div>
  <div id="crm-app" class="crm-layout" hidden>
    <aside class="crm-sidebar">
      <a href="/" class="crm-logo"><img src="/brand/shinext-logo-original.webp" alt="Shinext"></a>
      <div class="crm-user">
        <span id="crm-user-role">Colaborador</span>
        <strong id="crm-user-name">Shinext</strong>
      </div>
      <nav id="crm-nav" class="crm-nav" aria-label="Módulos Shinext CRM"></nav>
      <button id="crm-logout" class="crm-logout" type="button">Cerrar sesión</button>
    </aside>
    <div class="crm-workspace">
      <header class="crm-topbar">
        <button id="crm-menu-toggle" class="crm-menu-toggle" type="button" aria-label="Abrir menú">☰</button>
        <div>
          <p id="crm-section-kicker">Shinext</p>
          <h1 id="crm-section-title">Panel</h1>
        </div>
        <span id="crm-today" class="crm-date"></span>
      </header>
      <main id="crm-content" class="crm-content"></main>
    </div>
  </div>
  <script type="module" src="/crm/crm.js"></script>
</body>
</html>
