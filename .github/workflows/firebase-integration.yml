name: Firebase Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "tests/emulator/**"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: firebase-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Run Functions unit tests
        run: npm --prefix functions test

      - name: Run Firebase emulator suite
        run: npm run emulators:exec
