name: Firebase CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: firebase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-slim
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install test dependencies
        run: npm ci

      - name: Run UI and SEO tests
        run: node --test tests/ui/*.test.mjs tests/seo/*.test.mjs
