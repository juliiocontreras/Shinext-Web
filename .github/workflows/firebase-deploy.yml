name: Firebase Production Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Qué desplegar"
        required: true
        default: "hosting"
        type: choice
        options:
          - hosting
          - rules
          - functions
          - all
      run_full_validation:
        description: "Ejecutar emuladores antes del deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-slim
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate production configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Set FIREBASE_PROJECT_ID in the production environment."
            exit 1
          fi
          case "$FIREBASE_PROJECT_ID" in
            demo-*) echo "::error::Refusing to deploy to a demo project."; exit 1 ;;
          esac
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT_JSON in the production environment."
            exit 1
          fi

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Use Java 21
        if: ${{ inputs.run_full_validation }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        if: ${{ inputs.run_full_validation }}
        run: npm ci

      - name: Install Functions dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'functions') }}
        run: npm --prefix functions ci

      - name: Build Cloud Functions
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'functions') }}
        run: npm --prefix functions run build

      - name: Run Functions tests
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'functions') }}
        run: npm --prefix functions test

      - name: Run Firebase emulator suite
        if: ${{ inputs.run_full_validation }}
        run: npm run emulators:exec:integration

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Validate production project id
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          case "$FIREBASE_PROJECT_ID" in
            demo-*) echo "Refusing to deploy to demo project"; exit 1 ;;
          esac

      - name: Deploy all
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'all' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14.16.0 deploy --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Hosting
        if: ${{ inputs.deploy_target == 'hosting' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14.16.0 deploy --only hosting --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Functions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14.16.0 deploy --only functions --project "$FIREBASE_PROJECT_ID"

      - name: Deploy rules and indexes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'rules' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14.16.0 deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID"

      - name: Production Hosting smoke checks
        if: ${{ inputs.deploy_target == 'hosting' }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          export SHINEXT_BASE_URL="https://${FIREBASE_PROJECT_ID}.web.app"
          node scripts/production-hosting-smoke.mjs

      - name: Production full-stack smoke checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'all' }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          export SHINEXT_BASE_URL="https://${FIREBASE_PROJECT_ID}.web.app"
          node scripts/production-smoke.mjs

      - name: Remove credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
